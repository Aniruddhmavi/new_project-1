
trigger:
- main

pool:
Azure_Devpos

stages:
  - stage: Terraform Validation and Security Scan
    displayName: Validation
    jobs:
      - job: validation
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendAzureRmResourceGroupName: 'rg1'
            backendAzureRmStorageAccountName: 'stoarge1q'
            backendAzureRmContainerName: '$logs'
            backendAzureRmKey: 'terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'paperkey1'

