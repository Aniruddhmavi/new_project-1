
trigger:
- main

pool:
  name: Azure_Devpos

stages:
- stage: TerraformValidation
  displayName: Terraform Validation

  jobs:
  - job: validation
    steps:

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        backendServiceArm: paperkey1
        backendAzureRmResourceGroupName: rg1
        backendAzureRmStorageAccountName: stoarge1q
        backendAzureRmContainerName: '$logs'
        backendAzureRmKey: terraform.tfstate

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: azurerm
        command: plan
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        environmentServiceNameAzureRM: paperkey1
